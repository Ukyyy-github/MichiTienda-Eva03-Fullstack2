spring.application.name=michipanaderia
spring.datasource.url=jdbc:postgresql://ep-holy-recipe-b6mxakkk-pooler.c-2.sa-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8081,http://localhost:5173,http://localhost:3000,http://localhost:4200}

spring.flyway.baseline-on-migrate=true


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
